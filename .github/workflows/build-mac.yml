# =====================================================================
# 墨痕 · macOS 自动构建（GitHub Actions）
# ---------------------------------------------------------------------
# 触发方式：
#   1) 推送正式版 tag（无 v 前缀，与 Windows 自动更新约定一致）：
#        git tag 1.1.0 && git push --tags
#      → 自动在真实 Mac runner（macos-15 / Apple Silicon）上构建 arm64 架构，
#        产出 .dmg / .zip / .sha256.txt，并【追加】进同名 release
#        （例如已手动建好的 1.1.0 release，含 Windows 文件，这里补上 Mac 文件）。
#      （注：x86_64 原走 macos-13 Intel runner，常年排队，故暂仅发 arm64；
#         Intel Mac 用户可改用源码/portable 方式运行。）
#   2) 手动触发（Actions 页面 Run workflow，填 version=1.1.0）：
#        构建并把 Mac 产物【追加】进同名 release，不新建。
#
# 说明：
#   - 用真实 Apple 硬件 runner，符合 Apple 许可，且免费（公开仓库无限分钟）。
#   - Windows 无法交叉编译 macOS 二进制，必须在 Mac 上打包（此处用 CI Mac runner）。
#   - 本 workflow 不新建 release，只把 Mac 产物追加进已存在的同名 release，
#     避免与 Windows 手动上传的 release 冲突、也避免 Windows 自动更新因 tag 不一致误报。
#   - 可选代码签名：在仓库 Settings → Secrets 里配置 MACOS_SIGN_IDENTITY
#     （证书需另经 keychain 导入，本 workflow 仅演示 identity 透传）。
# =====================================================================

name: Build macOS

on:
  push:
    tags:
      - '[0-9]*'        # 正式版 tag：1.1.0 / 2.0.0（无 v 前缀，与 Windows 自动更新 tag 约定一致）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，例如 1.1.0；仅手动触发时生效，产物追加进同名 release）'
        required: false
        default: '1.1.0'

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15       # Apple Silicon（arm64）
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build .app / .dmg / .zip
        env:
          MH_ARCH: ${{ matrix.arch }}
          MH_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash macOS/build_mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            deploy/Output/墨痕-v*-macos-${{ matrix.arch }}.dmg
            deploy/Output/墨痕-v*-macos-${{ matrix.arch }}.zip
            deploy/Output/墨痕-v*-macos-${{ matrix.arch }}.dmg.sha256.txt
            deploy/Output/墨痕-v*-macos-${{ matrix.arch }}.zip.sha256.txt

  release:
    name: Attach Mac assets to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout (needed for gh to locate repo context)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List collected files
        run: find artifacts -type f

      - name: Upload Mac .dmg/.zip to the existing release (append, not create)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # tag push 时用 tag 名；手动触发时用输入的 version
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          # release 已存在（例如手动建的 1.1.0 含 Windows 文件）则直接追加；
          # 若不存在则先建一个空 release 再追加（纯 Mac 场景）。
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "墨痕 $TAG" --generate-notes
          fi
          # 把 Mac 产物追加进同一 release；--clobber 覆盖同名文件
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256.txt' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
